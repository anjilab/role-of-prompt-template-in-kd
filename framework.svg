<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="198mm" height="86.5mm"
     viewBox="0 0 560 245" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222"/>
    </marker>
  </defs>

  <!-- ============ PANEL A ============ -->
  <rect x="2" y="4" width="556" height="155" rx="5"
        fill="#f7faff" stroke="#cdd9ea" stroke-width="0.7"/>
  <text x="10" y="17" font-size="11" font-weight="700" fill="#000">A. Distillation Setup</text>

  <!-- Dataset card -->
  <rect x="12" y="42" width="90" height="92" rx="4"
        fill="#e9f0fa" stroke="#b8c8de" stroke-width="0.7"/>
  <!-- Database icon (larger) -->
  <g transform="translate(57, 72)">
    <ellipse cx="0" cy="-15" rx="20" ry="5.5" fill="#cfdcf0" stroke="#5d77a8" stroke-width="0.8"/>
    <path d="M-20,-15 V14 A20,5.5 0 0 0 20,14 V-15" fill="#dde7f5" stroke="#5d77a8" stroke-width="0.8"/>
    <ellipse cx="0" cy="-15" rx="20" ry="5.5" fill="#cfdcf0" stroke="#5d77a8" stroke-width="0.8"/>
    <ellipse cx="0" cy="-7" rx="20" ry="5.5" fill="none" stroke="#5d77a8" stroke-width="0.6"/>
    <ellipse cx="0" cy="1" rx="20" ry="5.5" fill="none" stroke="#5d77a8" stroke-width="0.6"/>
  </g>
  <text x="57" y="109" font-size="9" font-weight="700" text-anchor="middle" fill="#000">Benign Utility</text>
  <text x="57" y="119" font-size="9" font-weight="700" text-anchor="middle" fill="#000">Dataset</text>

  <!-- Templates column header -->
  <text x="200" y="36" font-size="9" font-weight="600" text-anchor="middle" fill="#000">Prompt Templates</text>

  <!-- Non-chat template -->
  <rect x="130" y="42" width="140" height="54" rx="4"
        fill="#e7f3e0" stroke="#7fa775" stroke-width="0.8"/>
  <g transform="translate(141, 55)" stroke="#4d8c5d" fill="#ffffff" stroke-linejoin="round">
    <path d="M-5,-7 L2,-7 L6,-3 L6,7 L-5,7 Z" stroke-width="0.9"/>
    <polyline points="2,-7 2,-3 6,-3" fill="none" stroke-width="0.9"/>
    <line x1="-2.5" y1="0" x2="3" y2="0" stroke-width="0.7"/>
    <line x1="-2.5" y1="2.5" x2="3" y2="2.5" stroke-width="0.7"/>
    <line x1="-2.5" y1="5" x2="1.5" y2="5" stroke-width="0.7"/>
  </g>
  <text x="153" y="57" font-size="9.5" font-weight="700" fill="#000">Non-chat template</text>
  <!-- Code block dashed -->
  <rect x="135" y="64" width="130" height="28" rx="2"
        fill="#ffffff" stroke="#7fa775" stroke-width="0.5" stroke-dasharray="1.5,1"/>
  <text x="139" y="72.5" font-size="7" font-family="'Courier New', Courier, monospace" fill="#000">### Instruction</text>
  <text x="139" y="80.5" font-size="7" font-family="'Courier New', Courier, monospace" fill="#000">{query}</text>
  <text x="139" y="88.5" font-size="7" font-family="'Courier New', Courier, monospace" fill="#000">### Response:</text>

  <!-- Chat template -->
  <rect x="130" y="100" width="140" height="54" rx="4"
        fill="#fcebd5" stroke="#d49862" stroke-width="0.8"/>
  <g transform="translate(141, 113)" stroke="#c87c2c" fill="#ffffff" stroke-linejoin="round">
    <path d="M-5,-6 H6 Q8,-6 8,-4 V2 Q8,4 6,4 H1 L-2,7 V4 H-5 Q-7,4 -7,2 V-4 Q-7,-6 -5,-6 Z" stroke-width="0.9"/>
    <circle cx="-3" cy="-1" r="0.8" fill="#c87c2c" stroke="none"/>
    <circle cx="0" cy="-1" r="0.8" fill="#c87c2c" stroke="none"/>
    <circle cx="3" cy="-1" r="0.8" fill="#c87c2c" stroke="none"/>
  </g>
  <text x="153" y="115" font-size="9.5" font-weight="700" fill="#000">Chat template</text>
  <rect x="135" y="122" width="130" height="28" rx="2"
        fill="#ffffff" stroke="#d49862" stroke-width="0.5" stroke-dasharray="1.5,1"/>
  <text x="139" y="130.5" font-size="7" font-family="'Courier New', Courier, monospace" fill="#000">&lt;system&gt; ...</text>
  <text x="139" y="138.5" font-size="7" font-family="'Courier New', Courier, monospace" fill="#000">&lt;user&gt; {query}</text>
  <text x="139" y="146.5" font-size="7" font-family="'Courier New', Courier, monospace" fill="#000">&lt;assistant&gt;</text>

  <!-- Connection lines: templates -> KD -->
  <line x1="270" y1="69" x2="310" y2="69" stroke="#4d8c5d" stroke-width="1"/>
  <circle cx="270" cy="69" r="1.8" fill="#fff" stroke="#4d8c5d" stroke-width="1"/>
  <line x1="270" y1="127" x2="310" y2="127" stroke="#c87c2c" stroke-width="1"/>
  <circle cx="270" cy="127" r="1.8" fill="#fff" stroke="#c87c2c" stroke-width="1"/>

  <!-- Knowledge Distillation outer (dashed) -->
  <rect x="310" y="32" width="240" height="120" rx="5"
        fill="none" stroke="#9a85c2" stroke-width="0.9" stroke-dasharray="3,1.5"/>
  <rect x="372" y="27" width="116" height="10" fill="#f7faff"/>
  <text x="430" y="35" font-size="9.5" font-weight="700" text-anchor="middle" fill="#000">Knowledge Distillation</text>

  <!-- ===== Teacher LLM (larger model) ===== -->
  <rect x="318" y="45" width="104" height="92" rx="4"
        fill="#ebe2f4" stroke="#9a85c2" stroke-width="0.8"/>
  <g transform="translate(370, 80)" stroke="#5a4090" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="0.75" opacity="0.8">
      <line x1="-30" y1="-16" x2="-10" y2="-18"/>
      <line x1="-30" y1="-16" x2="-10" y2="-6"/>
      <line x1="-30" y1="-16" x2="-10" y2="6"/>
      <line x1="-30" y1="-16" x2="-10" y2="18"/>
      <line x1="-30" y1="0" x2="-10" y2="-18"/>
      <line x1="-30" y1="0" x2="-10" y2="-6"/>
      <line x1="-30" y1="0" x2="-10" y2="6"/>
      <line x1="-30" y1="0" x2="-10" y2="18"/>
      <line x1="-30" y1="16" x2="-10" y2="-18"/>
      <line x1="-30" y1="16" x2="-10" y2="-6"/>
      <line x1="-30" y1="16" x2="-10" y2="6"/>
      <line x1="-30" y1="16" x2="-10" y2="18"/>
      <line x1="-10" y1="-18" x2="10" y2="-18"/>
      <line x1="-10" y1="-18" x2="10" y2="-6"/>
      <line x1="-10" y1="-18" x2="10" y2="6"/>
      <line x1="-10" y1="-18" x2="10" y2="18"/>
      <line x1="-10" y1="-6" x2="10" y2="-18"/>
      <line x1="-10" y1="-6" x2="10" y2="-6"/>
      <line x1="-10" y1="-6" x2="10" y2="6"/>
      <line x1="-10" y1="-6" x2="10" y2="18"/>
      <line x1="-10" y1="6" x2="10" y2="-18"/>
      <line x1="-10" y1="6" x2="10" y2="-6"/>
      <line x1="-10" y1="6" x2="10" y2="6"/>
      <line x1="-10" y1="6" x2="10" y2="18"/>
      <line x1="-10" y1="18" x2="10" y2="-18"/>
      <line x1="-10" y1="18" x2="10" y2="-6"/>
      <line x1="-10" y1="18" x2="10" y2="6"/>
      <line x1="-10" y1="18" x2="10" y2="18"/>
      <line x1="10" y1="-18" x2="30" y2="-10"/>
      <line x1="10" y1="-6" x2="30" y2="-10"/>
      <line x1="10" y1="6" x2="30" y2="-10"/>
      <line x1="10" y1="18" x2="30" y2="-10"/>
      <line x1="10" y1="-18" x2="30" y2="10"/>
      <line x1="10" y1="-6" x2="30" y2="10"/>
      <line x1="10" y1="6" x2="30" y2="10"/>
      <line x1="10" y1="18" x2="30" y2="10"/>
    </g>
    <g fill="#f7f2fc" stroke-width="1.2">
      <circle cx="-30" cy="-16" r="3.2"/>
      <circle cx="-30" cy="0" r="3.2"/>
      <circle cx="-30" cy="16" r="3.2"/>
      <circle cx="-10" cy="-18" r="3.2"/>
      <circle cx="-10" cy="-6" r="3.2"/>
      <circle cx="-10" cy="6" r="3.2"/>
      <circle cx="-10" cy="18" r="3.2"/>
      <circle cx="10" cy="-18" r="3.2"/>
      <circle cx="10" cy="-6" r="3.2"/>
      <circle cx="10" cy="6" r="3.2"/>
      <circle cx="10" cy="18" r="3.2"/>
      <circle cx="30" cy="-10" r="3.2"/>
      <circle cx="30" cy="10" r="3.2"/>
    </g>
  </g>
  <text x="370" y="117" font-size="10" font-weight="700" text-anchor="middle" fill="#000">Teacher LLM</text>

  <!-- ===== Student LLM (smaller model) ===== -->
  <rect x="460" y="55" width="76" height="70" rx="4"
        fill="#dff3f1" stroke="#5aa6a0" stroke-width="0.8"/>
  <g transform="translate(498, 80)" stroke="#2b8f88" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="0.7" opacity="0.8">
      <line x1="-22" y1="-12" x2="0" y2="-15"/>
      <line x1="-22" y1="-12" x2="0" y2="0"/>
      <line x1="-22" y1="-12" x2="0" y2="15"/>
      <line x1="-22" y1="12" x2="0" y2="-15"/>
      <line x1="-22" y1="12" x2="0" y2="0"/>
      <line x1="-22" y1="12" x2="0" y2="15"/>
      <line x1="0" y1="-15" x2="22" y2="-8"/>
      <line x1="0" y1="0" x2="22" y2="-8"/>
      <line x1="0" y1="15" x2="22" y2="-8"/>
      <line x1="0" y1="-15" x2="22" y2="8"/>
      <line x1="0" y1="0" x2="22" y2="8"/>
      <line x1="0" y1="15" x2="22" y2="8"/>
    </g>
    <g fill="#f2fbfa" stroke-width="1.1">
      <circle cx="-22" cy="-12" r="3"/>
      <circle cx="-22" cy="12" r="3"/>
      <circle cx="0" cy="-15" r="3"/>
      <circle cx="0" cy="0" r="3"/>
      <circle cx="0" cy="15" r="3"/>
      <circle cx="22" cy="-8" r="3"/>
      <circle cx="22" cy="8" r="3"/>
    </g>
  </g>
  <text x="498" y="113" font-size="10" font-weight="700" text-anchor="middle" fill="#000">Student LLM</text>

  <!-- Connector teacher -> student (shorter, thicker) -->
  <line x1="422" y1="92" x2="460" y2="92" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ============ PANEL B ============ -->
  <rect x="2" y="165" width="556" height="79" rx="5"
        fill="#f7faff" stroke="#cdd9ea" stroke-width="0.7"/>
  <text x="10" y="178" font-size="11" font-weight="700" fill="#000">B. Post-training Evaluation and Analysis</text>

  <!-- Utility -->
  <rect x="8" y="186" width="176" height="50" rx="4"
        fill="#e7f0fa" stroke="#b8c8de" stroke-width="0.7"/>
  <g transform="translate(22, 205)">
    <line x1="-8" y1="7" x2="9" y2="7" stroke="#2d6cb9" stroke-width="0.9"/>
    <line x1="-8" y1="7" x2="-8" y2="-9" stroke="#2d6cb9" stroke-width="0.9"/>
    <rect x="-5" y="2" width="3" height="5" fill="#2d6cb9"/>
    <rect x="-0.5" y="-2" width="3" height="9" fill="#2d6cb9"/>
    <rect x="4" y="-6" width="3" height="13" fill="#2d6cb9"/>
  </g>
  <text x="40" y="200" font-size="9.5" font-weight="700" fill="#000">Utility Evaluation</text>
  <line x1="40" y1="204" x2="178" y2="204" stroke="#b8c8de" stroke-width="0.5"/>
  <text x="40" y="215" font-size="7.3" fill="#4f5b6b">Measure task performance</text>
  <text x="40" y="224" font-size="7.3" fill="#4f5b6b">after distillation.</text>

  <!-- Safety -->
  <rect x="192" y="184" width="176" height="50" rx="4"
        fill="#f7e2e2" stroke="#d8a5a5" stroke-width="0.7"/>
  <g transform="translate(206, 205)">
    <path d="M0,-9 L8,-6 V0 Q8,6 0,10 Q-8,6 -8,0 V-6 Z"
          fill="#ffffff" stroke="#b53939" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M-2.5,0 L-0.5,2 L3,-2.5" fill="none" stroke="#b53939" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="224" y="200" font-size="9.5" font-weight="700" fill="#000">Safety Evaluation</text>
  <line x1="224" y1="204" x2="362" y2="204" stroke="#d8a5a5" stroke-width="0.5"/>
  <text x="224" y="215" font-size="7.3" fill="#4f5b6b">Test whether refusal</text>
  <text x="224" y="224" font-size="7.3" fill="#4f5b6b">behavior is preserved.</text>

  <!-- Mechanistic -->
  <rect x="376" y="184" width="176" height="50" rx="4"
        fill="#ece2f4" stroke="#b8a8d9" stroke-width="0.7"/>
  <g transform="translate(390, 205)">
    <line x1="-8" y1="7" x2="9" y2="7" stroke="#6b4faa" stroke-width="0.9"/>
    <line x1="-8" y1="7" x2="-8" y2="-9" stroke="#6b4faa" stroke-width="0.9"/>
    <circle cx="-4" cy="3" r="1.2" fill="#6b4faa"/>
    <circle cx="-1" cy="0" r="1.5" fill="#6b4faa"/>
    <circle cx="2" cy="-2" r="1" fill="#6b4faa"/>
    <circle cx="-2" cy="4" r="1" fill="#6b4faa"/>
    <circle cx="4" cy="1" r="1.3" fill="#6b4faa"/>
    <circle cx="-5" cy="-2" r="0.8" fill="#6b4faa"/>
    <circle cx="0" cy="-4" r="1" fill="#6b4faa"/>
  </g>
  <text x="408" y="200" font-size="9.5" font-weight="700" fill="#000">Mechanistic Analysis</text>
  <line x1="408" y1="204" x2="546" y2="204" stroke="#b8a8d9" stroke-width="0.5"/>
  <text x="408" y="215" font-size="7.3" fill="#4f5b6b">Compare internal representations</text>
  <text x="408" y="224" font-size="7.3" fill="#4f5b6b">across prompt templates.</text>
</svg>
